name: Patch stale admin tests

on:
  push:
    branches:
      - feature/utilidades-completas

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Refresh stale admin test expectations') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/utilidades-completas
      - name: Refresh expectations
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'tests/administration.test.js';
          let text = fs.readFileSync(file, 'utf8');
          const before = text;
          text = text.replace(
            'test("all 387 commands load, carry metadata and appear exactly once in paginated menus", () => {',
            'test("all 423 commands load, carry metadata and appear exactly once in paginated menus", () => {'
          );
          text = text.replace('assert.equal(d.records.length, 387);', 'assert.equal(d.records.length, 423);');
          text = text.replace(
            '  await run("menugeral", ["9999"]);\n  assert.match(messages[0].text, /Informe uma página/);',
            '  await run("menugeral");\n  assert.ok(messages[0].image);\n  assert.match(messages[0].caption, /Todos os comandos/);\n  assert.doesNotMatch(messages[0].caption, /Página \\d+\\//);'
          );
          if (text === before || !text.includes('d.records.length, 423') || !text.includes('messages[0].caption')) {
            console.error('Expected stale test patterns were not updated');
            process.exit(1);
          }
          fs.writeFileSync(file, text);
          NODE
      - name: Commit test refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/administration.test.js
          git commit -m "Refresh stale admin test expectations"
          git push origin HEAD:feature/utilidades-completas

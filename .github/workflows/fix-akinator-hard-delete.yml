name: Fix Akinator hard delete

on:
  push:
    branches:
      - fix/akinator-hard-delete

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/akinator-hard-delete
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Apply deletion fix
        run: python3 scripts/patch-akinator-hard-delete.py
      - run: npm ci --omit=dev
      - name: Run complete tests
        run: npm test
      - name: Validate registry
        run: |
          node - <<'NODE'
          const path = require('path');
          const { loadCommandModules, buildCommandRegistry } = require('./functions/commandRegistry');
          const loaded = loadCommandModules(path.join(process.cwd(), 'commands'), { clearCache: true });
          const built = buildCommandRegistry(loaded.records);
          if (loaded.errors.length) throw new Error(loaded.errors.map(x => `${x.file}: ${x.error.message}`).join('\n'));
          if (built.collisions.length) throw new Error(JSON.stringify(built.collisions));
          if (loaded.records.length !== 424) throw new Error(`Expected 424 commands, got ${loaded.records.length}`);
          console.log('OK: 424 commands, no collisions');
          NODE
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commands/brincadeiras/akinator.js tests/akinator.test.js
          git commit -m "Delete previous Akinator prompt before each answer"
          git push origin HEAD:fix/akinator-hard-delete

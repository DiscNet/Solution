name: Akinator integration

on:
  push:
    branches:
      - feature/akinator-whatsapp

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/akinator-whatsapp
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install Akinator client
        run: npm install silent-akinator-pro@4.0.3 --save

      - name: Enable interactive reply parsing and refresh command count
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const startFile = 'core/startBot.js';
          let start = fs.readFileSync(startFile, 'utf8');
          if (!start.includes('const { extractMessageText } = require("../functions/messageText");')) {
            const anchor = 'const runtimeLogger = require("../functions/runtimeLogger");';
            if (!start.includes(anchor)) throw new Error('runtimeLogger import anchor not found');
            start = start.replace(anchor, `${anchor}\nconst { extractMessageText } = require("../functions/messageText");`);
          }

          const oldFn = `function getMessageText(msg) {\n  if (msg.message?.conversation) return msg.message.conversation;\n  if (msg.message?.extendedTextMessage?.text) return msg.message.extendedTextMessage.text;\n  if (msg.message?.imageMessage?.caption) return msg.message.imageMessage.caption;\n  if (msg.message?.videoMessage?.caption) return msg.message.videoMessage.caption;\n  if (msg.message?.documentMessage?.caption) return msg.message.documentMessage.caption;\n  if (msg.message?.audioMessage?.caption) return msg.message.audioMessage.caption;\n  return "";\n}`;
          const newFn = `function getMessageText(msg) {\n  return extractMessageText(msg);\n}`;
          if (start.includes(oldFn)) start = start.replace(oldFn, newFn);
          if (!start.includes(newFn)) throw new Error('getMessageText patch failed');
          fs.writeFileSync(startFile, start);

          const testFile = 'tests/administration.test.js';
          let tests = fs.readFileSync(testFile, 'utf8');
          tests = tests.replace('all 423 commands load', 'all 424 commands load');
          tests = tests.replace('assert.equal(d.records.length, 423);', 'assert.equal(d.records.length, 424);');
          if (!tests.includes('d.records.length, 424')) throw new Error('command count refresh failed');
          fs.writeFileSync(testFile, tests);
          NODE

      - name: Run complete test suite
        run: npm test

      - name: Validate complete command registry
        run: |
          node - <<'NODE'
          const path = require('path');
          const { loadCommandModules, buildCommandRegistry } = require('./functions/commandRegistry');
          const loaded = loadCommandModules(path.join(process.cwd(), 'commands'), { clearCache: true });
          const built = buildCommandRegistry(loaded.records);
          if (loaded.errors.length) {
            console.error(loaded.errors.map(x => `${x.file}: ${x.error.stack || x.error.message}`).join('\n'));
            process.exit(1);
          }
          if (built.collisions.length) {
            console.error(built.collisions);
            process.exit(1);
          }
          if (loaded.records.length !== 424) {
            console.error(`Expected 424 commands, loaded ${loaded.records.length}`);
            process.exit(1);
          }
          if (!built.registry.akinator || built.registry.aki !== built.registry.akinator) {
            console.error('Akinator command/alias missing from registry');
            process.exit(1);
          }
          console.log(`OK: ${loaded.records.length} commands, no collisions`);
          NODE

      - name: Live Akinator smoke test in Portuguese
        run: |
          node - <<'NODE'
          const Akinator = require('silent-akinator-pro');
          (async () => {
            const aki = new Akinator({ region: 'pt', childMode: true });
            const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Akinator timeout')), 45000));
            const first = await Promise.race([aki.start(), timeout]);
            if (!first?.question || !aki.question) throw new Error('Akinator did not return a Portuguese game question');
            const second = await Promise.race([aki.answer('idk'), timeout]);
            if (!second || (!second.question && !second.guess)) throw new Error('Akinator did not accept an answer');
            if (!aki.guessed && aki.step > 0) {
              const back = await Promise.race([aki.back(), timeout]);
              if (!back?.question) throw new Error('Akinator back() did not return a question');
            }
            console.log(`Akinator live OK: ${String(first.question).slice(0, 100)}`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Commit integrated Akinator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json core/startBot.js tests/administration.test.js
          git commit -m "Integrate Akinator dependency and interactive replies"
          git push origin HEAD:feature/akinator-whatsapp

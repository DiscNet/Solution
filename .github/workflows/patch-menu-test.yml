name: Refresh menu test

on:
  push:
    branches:
      - feature/utilidades-completas

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Refresh menu integration test' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/utilidades-completas
      - name: Patch menu test
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'tests/administration.test.js';
          let text = fs.readFileSync(file, 'utf8');
          const pattern = /test\("menu navigation preserves all pages, sections, aliases and custom prefixes", async \(\) => \{[\s\S]*?\n\}\);\ntest\("settings survive module reload and unrelated updates"/;
          if (!pattern.test(text)) {
            console.error('Menu test block not found');
            process.exit(1);
          }
          const block = `test("menu navigation preserves all pages, sections, aliases and custom prefixes", async () => {
            reset();
            const body = () => messages[0]?.text || messages[0]?.caption || "";
            await run("menu", ["adm"]);
            assert.match(body(), /\\.advertir/);
            await run("menu", ["rpg", "pets"]);
            assert.match(body(), /Uso: \\.pets/);
            await run("menugeral");
            assert.ok(messages[0].image);
            assert.match(body(), /Todos os comandos/);
            assert.doesNotMatch(body(), /Próxima:/);
            configLoader.salvarConfig({ prefix: "!" });
            await run("menuadm");
            assert.match(body(), /!advertir/);
            await run("info", ["figurinha"]);
            assert.match(body(), /!s/);
            configLoader.salvarConfig({ prefix: "." });
          });
          test("settings survive module reload and unrelated updates"`;
          text = text.replace(pattern, block);
          fs.writeFileSync(file, text);
          NODE
      - name: Commit refreshed test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/administration.test.js
          git commit -m "Refresh menu integration test"
          git push origin HEAD:feature/utilidades-completas

name: owner-groups-validation

on:
  push:
    branches:
      - fix/owner-group-management

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:commands

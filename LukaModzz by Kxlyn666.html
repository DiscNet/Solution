<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Contato - Redirecionamento WhatsApp</title>
    <style>
        /* Reset básico e configuração de altura total para centralização perfeita */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fundo suave e neutro para destacar o conteúdo */
            background: linear-gradient(145deg, purple 0%, black 100%);
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Container principal que agrupa a "capa" (imagem + texto) e a área clicável */
        .whatsapp-card {
            text-align: center;
            max-width: 340px;
            width: 100%;
            /* Leve sombra e borda arredondada para dar elegância */
            background: linear-gradient(purple, white);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            padding: 28px 20px 32px 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.2);
        }

        /* Efeito sutil ao passar o mouse ou toque */
        .whatsapp-card:hover {
            transform: scale(1.01);
            box-shadow: 0 30px 45px -12px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.8);
        }

        /* Área da imagem: circular, com borda e efeito de leve brilho */
        .avatar-wrapper {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            /* Centraliza um pouco acima do centro: usando margin-top negativo leve */
            /* Mas como o card já está centralizado no meio da tela, manteremos a imagem no topo do card */
            /* Para deixar "pouco acima" do centro geral, podemos adicionar uma margem negativa relativa ao card? 
               Não é necessário porque o body já centraliza. Porém se quiser um deslocamento vertical mais notável, 
               podemos mover o card inteiro um pouco para cima. Vamos fazer com translateY no .whatsapp-card */
            position: relative;
        }

        /* Imagem redonda perfeita */
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;      /* garante que a imagem cubra o círculo sem distorcer */
            border-radius: 50%;     /* corte redondo */
            display: block;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
            border: 4px solid black;
            transition: all 0.2s;
            background-color: #fff; /* fallback enquanto carrega */
        }

        /* Pequeno texto de call-to-action */
        .cta-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: #075e54;        /* verde WhatsApp escuro */
            margin: 16px 0 8px 0;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cta-text::before {
            content: "📱";
            font-size: 1.4rem;
        }

        .cta-text::after {
            content: "💬";
            font-size: 1.4rem;
        }

        .sub-message {
            font-size: 0.85rem;
            color: #3a3f47;
            background: rgba(220, 240, 230, 0.6);
            display: inline-block;
            padding: 6px 14px;
            border-radius: 60px;
            font-weight: 500;
            backdrop-filter: blur(2px);
        }

        /* Para dar a sensação de estar "pouco acima" do centro vertical,
           aplicamos um translateY sutil no card principal */
        .center-up {
            transform: translateY(-5%);
        }

        /* Ajuste responsivo: em telas muito pequenas reduz a imagem e espaçamento */
        @media (max-width: 480px) {
            .avatar-wrapper {
                width: 150px;
                height: 150px;
            }
            .cta-text {
                font-size: 1.1rem;
            }
            .whatsapp-card {
                padding: 20px 16px 26px;
            }
        }

        /* Ícone de clique discreto */
        .click-hint {
            margin-top: 12px;
            font-size: 0.7rem;
            opacity: 0.6;
            color: #2c3e2f;
        }
    </style>
</head>
<body>
    <!-- Card clicável que funciona como "capa" e redireciona para o WhatsApp -->
    <!-- Definimos um número de telefone de exemplo (altere para o número desejado) 
         e uma mensagem padrão amigável. O link é construído com target="_blank" 
         para abrir em nova guia/app WhatsApp -->
    <div class="whatsapp-card center-up" id="whatsappLink">
        <div class="avatar-wrapper">
            <!-- IMAGEM PUXADA DE UM LINK (URL EXTERNA) 
                 Use uma imagem de exemplo grátis e confiável, mas você pode trocar pelo link que quiser.
                 Esta é uma foto de perfil ilustrativa de alta qualidade (placekitten ou imgur). 
                 Como estamos usando uma imagem com URL pública, garantimos corte redondo com CSS. 
                 Para testes, usei uma imagem de pessoa/avatar neutro de placeholder. 
                 Se preferir outra imagem, basta alterar o src. -->
            <img class="profile-img" 
                 src="https://ik.imagekit.io/3cki3c6xi/fbca0edeb71854ee48d203e6c5a6cb86.jpg" 
                 alt="Foto de perfil - Contato WhatsApp"
                 onerror="this.src='https://placehold.co/400x400?text=Imagem+Não+Carregou'">
        </div>
        <div class="cta-text">
            Falar no WhatsApp
        </div>
        <div class="sub-message">
            👋 Clique na capa e converse conosco
        </div>
        <div class="click-hint">
            redireciona para o app • atendimento rápido
        </div>
    </div>

    <script>
        (function() {
            // =============================================================
            // CONFIGURAÇÕES DO WHATSAPP (ALTERE AQUI SEU NÚMERO E MENSAGEM)
            // =============================================================
            // Número no formato internacional sem espaços nem caracteres especiais.
            // Exemplo para Brasil: 55 + DDD + número. 
            // Coloque seu número real ou mantenha o de exemplo (número de teste da documentação)
            const phoneNumber = "5511999999999";   // <-- SUBSTITUA PELO SEU NÚMERO AQUI (com código do país e DDD)
            
            // Mensagem pré-definida (opcional, pode ser vazia ou personalizada)
            // Use encodeURIComponent para compor a URL corretamente
            const defaultMessage = "Olá! Vi sua capa e gostaria de conversar.";
            
            // Monta a URL do WhatsApp (Web/App)
            // O link "https://wa.me/" é universal e funciona tanto em desktop quanto mobile.
            // Se preferir "https://api.whatsapp.com/send", também funciona, mas wa.me é mais limpo.
            function buildWhatsAppUrl() {
                // Remove qualquer caractere não numérico, apenas por segurança (caso usuário digite com traços)
                let cleanNumber = phoneNumber.replace(/\D/g, '');
                if (!cleanNumber) {
                    // fallback (nunca deve ocorrer, mas evita erro)
                    console.warn("Número de telefone inválido, usando número exemplo");
                    cleanNumber = "5511999999999";
                }
                // Codifica a mensagem para URL
                const encodedMsg = encodeURIComponent(defaultMessage);
                // Usa wa.me para redirecionamento inteligente + mensagem opcional
                return `https://wa.me/${cleanNumber}?text=${encodedMsg}`;
            }
            
            // Obtém o elemento que servirá como capa clicável
            const cardElement = document.getElementById('whatsappLink');
            
            if (cardElement) {
                // Adiciona estilo de ponteiro para indicar que é clicável
                cardElement.style.cursor = 'pointer';
                
                // Função que executa o redirecionamento
                function redirectToWhatsApp(event) {
                    // Evita qualquer comportamento padrão indesejado
                    if (event) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    const whatsappUrl = buildWhatsAppUrl();
                    // Abre o link em uma nova aba/janela (comportamento esperado para WhatsApp)
                    // Isso funciona bem em mobile (abre o app se instalado) e em desktop (abre WhatsApp Web)
                    window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
                }
                
                // Adiciona evento de clique
                cardElement.addEventListener('click', redirectToWhatsApp);
                
                // Para acessibilidade: permite que o usuário pressione Enter ou Espaço se o card receber foco
                cardElement.setAttribute('role', 'button');
                cardElement.setAttribute('tabindex', '0');
                cardElement.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        redirectToWhatsApp(e);
                    }
                });
                
                // Opcional: pequeno feedback visual no clique (efeito de leve escala)
                cardElement.addEventListener('mousedown', () => {
                    cardElement.style.transform = 'translateY(-5%) scale(0.99)';
                });
                cardElement.addEventListener('mouseup', () => {
                    cardElement.style.transform = 'translateY(-5%) scale(1.01)';
                });
                cardElement.addEventListener('mouseleave', () => {
                    cardElement.style.transform = 'translateY(-5%)';
                });
                // Como a classe .center-up já tem translateY(-5%), preservamos no estado normal
                // e ajustamos no mouseup/mouseleave para manter a posição original.
                // No entanto, ao adicionar scale podemos conflitar com o translateY, então vamos melhorar:
                // Vamos resetar a transformação corretamente.
                const originalTransform = 'translateY(-5%)';
                cardElement.addEventListener('mouseup', () => {
                    cardElement.style.transform = originalTransform;
                });
                cardElement.addEventListener('mouseleave', () => {
                    cardElement.style.transform = originalTransform;
                });
                // corrigir mousedown: aplicar escala junto com o translate
                cardElement.addEventListener('mousedown', () => {
                    cardElement.style.transform = 'translateY(-5%) scale(0.97)';
                });
            } else {
                console.error('Elemento com id "whatsappLink" não encontrado.');
            }
        })();
    </script>
</body>
</html>
